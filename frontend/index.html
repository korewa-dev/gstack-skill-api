<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GStack Skills — Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-container { background: #161b22; border: 1px solid #30363d; padding: 2rem; border-radius: 12px; width: 100%; max-width: 400px; }
    h1 { color: #58a6ff; margin-bottom: 0.5rem; }
    .subtitle { color: #8b949e; margin-bottom: 1.5rem; }
    .input-group { margin-bottom: 1rem; }
    label { display: block; color: #8b949e; margin-bottom: 0.5rem; font-size: 0.9rem; }
    input { width: 100%; padding: 0.75rem 1rem; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #c9d1d9; font-size: 1rem; }
    input:focus { outline: none; border-color: #58a6ff; }
    button { width: 100%; padding: 0.75rem; background: #1f6feb; border: none; border-radius: 8px; color: white; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #388bfd; }
    .error { color: #f85149; margin-top: 0.5rem; font-size: 0.9rem; display: none; }
    .hint { color: #6e7681; font-size: 0.8rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>GStack Skills</h1>
    <p class="subtitle">Enter your API key to continue</p>
    <div class="input-group">
      <label for="apiKey">API Key</label>
      <input type="password" id="apiKey" placeholder="Enter API key..." autocomplete="current-password">
    </div>
    <button onclick="login()">Access Skills</button>
    <div class="error" id="error">Invalid API key</div>
    <p class="hint">Contact the administrator for access</p>
  </div>
  <script>
    const STORAGE_KEY = 'gstack_api_key';
    const API_BASE = 'https://gstack-skill-api.beerman.workers.dev';
    
    // Check if already authenticated
    const savedKey = localStorage.getItem(STORAGE_KEY);
    if (savedKey) {
      showApp(savedKey);
    }
    
    document.getElementById('apiKey').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') login();
    });
    
    function login() {
      const key = document.getElementById('apiKey').value.trim();
      if (!key) return;
      
      fetch(`${API_BASE}/api/skills`, { headers: { 'Authorization': `Bearer ${key}` } })
        .then(resp => {
          if (resp.ok) {
            localStorage.setItem(STORAGE_KEY, key);
            showApp(key);
          } else {
            document.getElementById('error').style.display = 'block';
          }
        })
        .catch(() => {
          document.getElementById('error').style.display = 'block';
        });
    }
    
    function showApp(key) {
      window.location.href = `/app.html?key=${encodeURIComponent(key)}`;
    }
  </script>
</body>
</html>
